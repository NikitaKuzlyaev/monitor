services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ADMIN_CODE: ${APP_ADMIN_CODE:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      CODEFORCES_API_KEY: ${CODEFORCES_API_KEY:-}
      CODEFORCES_API_SECRET: ${CODEFORCES_API_SECRET:-}
      CODEFORCES_CONTEST_ID: ${CODEFORCES_CONTEST_ID:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      REDIS_KV_SIMPLE_CACHE_HOST: redis
      REDIS_KV_SIMPLE_CACHE_PORT: "6379"
      REDIS_KV_SIMPLE_CACHE_DB: "0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"

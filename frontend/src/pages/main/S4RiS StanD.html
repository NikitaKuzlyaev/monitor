<html>
   <head>
      <link href="styles/style.css" type="text/css" rel="stylesheet" media="screen">
      <script src="scripts/jquery.min.js"></script>
      <script src="scripts/jquery.localscroll-1.2.7-min.js"></script>
      <script src="scripts/jquery.scrollTo-1.4.2-min.js"></script>

      <script src="scripts/ejudge.convertor.js"></script>

      <script>
         document.addEventListener("DOMContentLoaded", function() {
             // Находим textarea
             const logArea = document.querySelector("#contest-log textarea");
             
             // Получаем лог из localStorage
             const savedLog = localStorage.getItem("unfreeze_logs") || "";
      
             // Вставляем его в textarea
             logArea.value = savedLog;
         });
      </script>

      <meta charset="UTF-8">
      <meta HTTP-EQUIV="pragma" CONTENT="no-cache">
      <meta HTTP-EQUIV="Cache-Control" CONTENT="no-cache">
      <meta name="description" content="" />
      <meta name="author" content=""/>
      <title>Unfreeze</title>
   </head>
   <body>
   <script>
         var L18n = new L18n();
   </script>
      <div id="wrapper">
         <div id="standings">
            <div id="standings-table" style="position:relative; overflow:hidden;">
            </div>
            <div id="contest-log">
               <!-- <h2><script>document.write(L18n.autoTranslate("chooseLogFormat"))</script></h2> -->
               <select class="select-log">
                  <option value="stand">JSON</option>
                  <option value="ejudge">Ejudge</option>
               </select>
               <!-- <h2><script>document.write(L18n.autoTranslate("chooseFrameSize"))</script></h2> -->
               <select class="select-frameSize">
                  <option selected value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
               </select>
               <!-- <h2><script>document.write(L18n.autoTranslate("chooseCurrentPos"))</script></h2> -->
               <select class="select-currentRow">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option selected="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
               </select>
               <!-- <h2><script>document.write(L18n.autoTranslate("chooseDefrostingOrder"))</script></h2> -->
               <select class="select-defrosting-order">
                  <option selected value="alphabeticProblemOrder"><script>document.write(L18n.autoTranslate("alphabeticProblemOrder"))</script></option>
                  <option value="increasingLastSubmitTime"><script>document.write(L18n.autoTranslate("increasingLastSubmitTime"))</script></option>
               </select>
               <!-- <h2><script>document.write(L18n.autoTranslate("insertLog"))</script></h2> -->
               <div>
                  <textarea rows="10" cols="50"></textarea>
               </div>
               <script>
                  document.write("<button type=\"submit\" class=\"download-button\">");
                  document.write(L18n.autoTranslate("load"));
                  document.write("</button>");
               </script>
               
               <p>
                  <!-- <ul><h2><script>document.write(L18n.autoTranslate("control"))</script></h2> -->
                  <li>N - go next</li>
                  <li>F - go FAST next</li>
                  <li>B - go back</li>
                  </ul>
               </p>
              
               <p>
               
               </p>
           </div>
         </div>
